# Cloudflare Workers + Durable Objects (all on the Workers Free plan).
#   npm run dev      → local, http://localhost:8787 (state in .wrangler/)
#   npm run deploy   → production
name = "why-are-you-like-this"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# public/ is served directly by Cloudflare; the Worker only runs for
# /api/*, /ws and the legacy /why_are_you_like_this/* path.
assets = { directory = "./public", binding = "ASSETS" }

routes = [
  { pattern = "why-are-you-like-this.krachtzen.com", custom_domain = true },
  # Old links keep working. Remove this route from the OLD worker first.
  { pattern = "krachtzen.com/why_are_you_like_this*", zone_name = "krachtzen.com" },
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# SQLite-backed classes are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Directory"]

[observability]
enabled = true

# Secrets (not in this file):  npx wrangler secret put ADMIN_PASSWORD
