<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Why Are You Like This?</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    
    .login-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
      border-radius: var(--border-radius);
      padding: 40px;
      box-shadow: var(--shadow);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .login-title {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }
    
    .login-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .admin-screen {
      display: none;
    }
    
    .admin-screen.active {
      display: block;
    }
    
    .login-screen.hidden {
      display: none;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .admin-title {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--accent-gold);
    }
    
    .admin-actions {
      display: flex;
      gap: 10px;
    }
    
    .refresh-btn, .logout-btn {
      width: auto;
      padding: 10px 20px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
      border-radius: var(--border-radius);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    
    .stat-value {
      font-family: 'Bangers', cursive;
      font-size: 2.5rem;
      color: var(--accent-primary);
    }
    
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .rooms-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .room-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .room-code-badge {
      font-family: 'Bangers', cursive;
      font-size: 1.5rem;
      color: var(--accent-gold);
      letter-spacing: 3px;
    }
    
    .room-state {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .room-state.lobby {
      background: rgba(0, 210, 211, 0.2);
      color: var(--team-a);
    }
    
    .room-state.playing, .room-state.roundSetup, .room-state.roundActive {
      background: rgba(38, 222, 129, 0.2);
      color: var(--success);
    }
    
    .room-state.gameOver {
      background: rgba(255,255,255,0.1);
      color: var(--text-muted);
    }
    
    .room-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    
    .room-info-item {
      font-size: 0.9rem;
    }
    
    .room-info-label {
      color: var(--text-muted);
      margin-right: 5px;
    }
    
    .room-players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .player-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.08);
    }
    
    .player-badge.team-a {
      border-left: 3px solid var(--team-a);
    }
    
    .player-badge.team-b {
      border-left: 3px solid var(--team-b);
    }
    
    .player-badge.disconnected {
      opacity: 0.5;
    }
    
    .player-badge.host::before {
      content: '👑 ';
    }
    
    .room-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .room-actions .btn {
      width: auto;
      flex: 1;
      padding: 10px 15px;
      font-size: 0.85rem;
    }
    
    .no-rooms {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 20px;
      background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
      border-radius: var(--border-radius);
    }
    
    .back-link {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    
    .back-link:hover {
      color: var(--text-primary);
    }
    
    .error-message {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 10px;
    }
    
    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .room-info {
        grid-template-columns: 1fr;
      }
      
      .admin-header {
        flex-direction: column;
        align-items: stretch;
      }
      
      .admin-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Enter password to access admin dashboard</p>
        <form id="login-form" class="login-form">
          <input type="password" id="password-input" class="input-field" placeholder="Password" required>
          <button type="submit" class="btn btn-primary">Login</button>
          <p id="login-error" class="error-message" style="display: none;"></p>
        </form>
        <a href="./" class="back-link" style="margin-top: 20px;">← Back to Game</a>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-screen" class="admin-screen">
      <a href="./" class="back-link">← Back to Game</a>
      
      <div class="admin-header">
        <h1 class="admin-title">Admin Dashboard</h1>
        <div class="admin-actions">
          <button id="refresh-btn" class="btn btn-secondary refresh-btn">
            Refresh
          </button>
          <button id="logout-btn" class="btn btn-secondary logout-btn">
            Logout
          </button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div id="total-rooms" class="stat-value">0</div>
          <div class="stat-label">Active Rooms</div>
        </div>
        <div class="stat-card">
          <div id="total-players" class="stat-value">0</div>
          <div class="stat-label">Total Players</div>
        </div>
        <div class="stat-card">
          <div id="games-in-progress" class="stat-value">0</div>
          <div class="stat-label">Games In Progress</div>
        </div>
      </div>

      <h2 style="margin-bottom: 15px; color: var(--text-secondary);">Active Rooms</h2>
      
      <div id="rooms-container" class="rooms-list">
        <div class="no-rooms">No active rooms</div>
      </div>

      <h2 style="margin: 30px 0 15px; color: var(--text-secondary);">Removed Words</h2>
      <div id="banned-container" class="room-players"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    const basePath = window.location.pathname.replace(/[^/]*$/, '');
    const $ = (id) => document.getElementById(id);
    const loginScreen = $('login-screen');
    const adminScreen = $('admin-screen');
    const loginError = $('login-error');
    let adminToken = sessionStorage.getItem('adminToken');
    let pollTimer = null;

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function showToast(message, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = message;
      $('toast-container').appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch(basePath + 'api/admin/' + path, {
        method,
        headers: { 'Content-Type': 'application/json', ...(adminToken ? { Authorization: 'Bearer ' + adminToken } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== 'login') { logout(true); throw new Error('Session expired'); }
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function showLogin() {
      clearInterval(pollTimer);
      loginScreen.classList.remove('hidden');
      adminScreen.classList.remove('active');
    }

    function showAdmin() {
      loginScreen.classList.add('hidden');
      adminScreen.classList.add('active');
      refresh();
      clearInterval(pollTimer);
      pollTimer = setInterval(refresh, 5000);
    }

    async function login(password) {
      try {
        const data = await api('login', { method: 'POST', body: { password } });
        adminToken = data.token;
        sessionStorage.setItem('adminToken', adminToken);
        loginError.style.display = 'none';
        showAdmin();
      } catch (e) {
        loginError.textContent = e.message;
        loginError.style.display = 'block';
      }
    }

    function logout(expired) {
      if (!expired && adminToken) api('logout', { method: 'POST' }).catch(() => {});
      sessionStorage.removeItem('adminToken');
      adminToken = null;
      showLogin();
      if (expired) showToast('Session expired. Please log in again.', 'error');
    }

    const STATE_LABELS = { lobby: 'Lobby', roundSetup: 'Between rounds', roundActive: 'Round active', gameOver: 'Game over' };

    function renderRooms(data) {
      $('total-rooms').textContent = data.stats.rooms;
      $('total-players').textContent = `${data.stats.online}/${data.stats.players}`;
      $('games-in-progress').textContent = data.stats.playing;
      const c = $('rooms-container');
      if (!data.rooms.length) { c.innerHTML = '<div class="no-rooms">No active rooms</div>'; return; }
      c.innerHTML = data.rooms.map(room => `
        <div class="room-card">
          <div class="room-header">
            <span class="room-code-badge">${esc(room.code)}</span>
            <span class="room-state ${esc(room.gameState)}">${esc(STATE_LABELS[room.gameState] || room.gameState)}</span>
          </div>
          <div class="room-info">
            <div class="room-info-item"><span class="room-info-label">Deck:</span><span>${esc(room.settings.language)} / ${esc(room.settings.difficulty)}</span></div>
            <div class="room-info-item"><span class="room-info-label">Cards left:</span><span>${esc(room.cardsRemaining)}</span></div>
            <div class="room-info-item"><span class="room-info-label">Score:</span>
              <span style="color: var(--team-a)">A: ${esc(room.scores.A)}</span> /
              <span style="color: var(--team-b)">B: ${esc(room.scores.B)}</span></div>
            <div class="room-info-item"><span class="room-info-label">Rounds:</span><span>${esc(room.rounds)}</span></div>
          </div>
          <div class="room-players">
            ${room.players.map(p => `<span class="player-badge team-${p.team === 'B' ? 'b' : 'a'} ${p.connected ? '' : 'disconnected'} ${p.isHost ? 'host' : ''}">${esc(p.name)}${p.connected ? '' : ' (offline)'}</span>`).join('')}
          </div>
          <div class="room-actions">
            <button class="btn btn-danger btn-small" data-close="${esc(room.code)}">Close Room</button>
          </div>
        </div>`).join('');
    }

    function renderBanned(banned) {
      const c = $('banned-container');
      const items = Object.entries(banned).flatMap(([lang, words]) => words.map(w => ({ lang, w })));
      if (!items.length) { c.innerHTML = '<div class="no-rooms">None</div>'; return; }
      c.innerHTML = items.map(({ lang, w }) =>
        `<span class="player-badge">${esc(lang)}: ${esc(w)} <button class="btn btn-small" data-unban="${esc(lang)}" data-word="${esc(w)}" style="width:auto;padding:2px 8px">restore</button></span>`).join('');
    }

    async function refresh() {
      try {
        const [rooms, banned] = await Promise.all([api('rooms'), api('banned')]);
        renderRooms(rooms);
        renderBanned(banned);
      } catch (e) { if (adminToken) showToast(e.message, 'error'); }
    }

    document.addEventListener('click', async (e) => {
      const close = e.target.closest('[data-close]');
      if (close) {
        const code = close.dataset.close;
        if (!confirm(`Close room ${code}? All players will be sent back to the start screen.`)) return;
        try { await api(`rooms/${encodeURIComponent(code)}/close`, { method: 'POST' }); showToast(`Room ${code} closed`, 'success'); refresh(); }
        catch (err) { showToast(err.message, 'error'); }
      }
      const unban = e.target.closest('[data-unban]');
      if (unban) {
        try { await api('unban', { method: 'POST', body: { language: unban.dataset.unban, word: unban.dataset.word } }); refresh(); }
        catch (err) { showToast(err.message, 'error'); }
      }
    });

    $('login-form').addEventListener('submit', (e) => { e.preventDefault(); login($('password-input').value); });
    $('refresh-btn').addEventListener('click', refresh);
    $('logout-btn').addEventListener('click', () => logout(false));

    if (adminToken) showAdmin(); else showLogin();
  </script>
</body>
</html>
